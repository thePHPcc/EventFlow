name: CI

on:
  push:
    branches:
      - main
  pull_request: null

jobs:
  ci:
    name: CI

    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: xdebug
          tools: none

      - name: Install dependencies
        run: php tools/composer install --no-interaction --no-progress

      - name: Run the quality gate
        run: php tools/composer ci
